# DRAFT, UNTESTED. Translation of the "web" job in .github/workflows/ci.yml for the Woodpecker PoC.
# Prepared locally by the assessor; NOT committed or pushed to the repository.
when:
  - event: [push, pull_request, manual]

steps:
  - name: install
    image: node:22-alpine
    commands:
      - cd web
      - npm ci

  - name: typecheck
    image: node:22-alpine
    depends_on: [install]
    commands:
      - cd web
      - npm run typecheck

  - name: test
    image: node:22-alpine
    depends_on: [install]
    commands:
      - cd web
      - npm test

  - name: build
    image: node:22-alpine
    depends_on: [typecheck, test]
    commands:
      - cd web
      - npm run build

  - name: audit
    image: node:22-alpine
    depends_on: [install]
    commands:
      - cd web
      - npm audit --omit=dev --audit-level=high
