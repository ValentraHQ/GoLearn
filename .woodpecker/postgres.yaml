# DRAFT, UNTESTED. Translation of the "postgres" job in .github/workflows/ci.yml for the Woodpecker PoC.
# Prepared locally by the assessor; NOT committed or pushed to the repository.
# The database credentials below are copied from the repository's own public CI file (throwaway test database).
when:
  - event: [push, pull_request, manual]

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: golearn
      POSTGRES_PASSWORD: golearn
      POSTGRES_DB: golearn

steps:
  - name: store-and-api-tests
    image: golang:1.26-alpine
    environment:
      GOMODCACHE: ${CI_WORKSPACE}/.gomodcache
      GOCACHE: ${CI_WORKSPACE}/.gocache
      GOLEARN_TEST_DATABASE_URL: postgres://golearn:golearn@postgres:5432/golearn?sslmode=disable
    commands:
      - apk add --no-cache postgresql-client
      - until pg_isready -h postgres -U golearn; do echo "waiting for postgres"; sleep 1; done
      - go test -count=1 ./internal/store ./internal/api
