name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -short -race ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  postgres:
    # Runs the store and API suites against a real PostgreSQL (one schema per test).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: golearn
          POSTGRES_PASSWORD: golearn
          POSTGRES_DB: golearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U golearn" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOLEARN_TEST_DATABASE_URL: postgres://golearn:golearn@localhost:5432/golearn?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./internal/store ./internal/api

  content:
    # Compiles and runs every lesson snippet and challenge solution against the tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./internal/content/ -count=1 -timeout 30m

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target api -t golearn-api:ci .
      - run: docker build -f deploy/runner.Dockerfile -t golearn-runner:ci .
