# Minimal single-node PostgreSQL for development clusters.
# For production use a managed database or an operator (CloudNativePG, Crunchy, Zalando).
#
# Credentials come from the golearn-db Secret, which you create out of band
# (see README.md); no password lives in this repository. TLS is enabled with a
# throw-away self-signed certificate generated by the init container, so clients
# can use sslmode=require (encrypted, certificate not verified). With a managed
# database or cert-manager, use sslmode=verify-full and a real CA instead.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: golearn
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: tls-cert
          image: alpine/openssl:3.5.8
          command: ["sh", "-c"]
          args:
            - >-
              openssl req -x509 -newkey rsa:2048 -nodes -days 3650
              -subj "/CN=postgres.golearn.svc"
              -keyout /tls/server.key -out /tls/server.crt
              && chmod 600 /tls/server.key
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tls, mountPath: /tls}
      containers:
        - name: postgres
          image: postgres:17-alpine
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/tls/server.crt
            - -c
            - ssl_key_file=/tls/server.key
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: golearn-db, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: golearn-db, key: POSTGRES_PASSWORD}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: {name: golearn-db, key: POSTGRES_DB}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tls, mountPath: /tls, readOnly: true}
      volumes:
        - name: tls
          emptyDir: {medium: Memory}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: golearn
spec:
  clusterIP: None
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432}
