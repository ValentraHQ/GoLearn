# Default-deny, then allow ingress to the API and API -> Postgres/DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: golearn
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api
  namespace: golearn
spec:
  podSelector:
    matchLabels: {app: golearn-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 8080}]
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
      ports: [{port: 5432}]
    - to:
        - namespaceSelector: {}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: golearn
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: golearn-api}}
      ports: [{port: 5432}]
