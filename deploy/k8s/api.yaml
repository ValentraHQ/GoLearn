apiVersion: apps/v1
kind: Deployment
metadata:
  name: golearn-api
  namespace: golearn
  labels: {app: golearn-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: golearn-api}
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: golearn-api}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: golearn-api:latest      # replace with your registry path and an immutable tag
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: golearn-config}
            - secretRef: {name: golearn-secrets}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: golearn-api
  namespace: golearn
spec:
  selector: {app: golearn-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: golearn-api
  namespace: golearn
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: golearn-api}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golearn
  namespace: golearn
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [golearn.example.com]
      secretName: golearn-tls
  rules:
    - host: golearn.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: golearn-api, port: {name: http}}
