# TEMPLATE ONLY — NOT part of kustomization.yaml and NOT meant to be applied as-is.
#
# It shows the keys the manifests expect, for use with a secret manager
# (External Secrets Operator, Sealed Secrets, CSI secrets store, ...).
# Every value below is an intentionally invalid placeholder; applying this file
# produces a deployment that cannot connect to anything.
#
# Do NOT replace the placeholders with real credentials and commit the result.
# Create real secrets out of band — see ../README.md.
apiVersion: v1
kind: Secret
metadata:
  name: golearn-db
  namespace: golearn
type: Opaque
stringData:
  POSTGRES_USER: "<set-via-secret-manager>"
  POSTGRES_PASSWORD: "<set-via-secret-manager>"
  POSTGRES_DB: "<set-via-secret-manager>"
---
apiVersion: v1
kind: Secret
metadata:
  name: golearn-secrets
  namespace: golearn
type: Opaque
stringData:
  # Format: postgres://USER:PASSWORD@postgres.golearn.svc:5432/DB?sslmode=require
  DATABASE_URL: "<set-via-secret-manager>"
  # GOLEARN_RUNNER_TOKEN: "<set-via-secret-manager>"   # only for GOLEARN_RUNNER=remote
