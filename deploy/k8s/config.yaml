apiVersion: v1
kind: ConfigMap
metadata:
  name: golearn-config
  namespace: golearn
data:
  GOLEARN_ADDR: ":8080"
  GOLEARN_STATIC_DIR: "/web/dist"
  GOLEARN_COOKIE_SECURE: "true"
  GOLEARN_TRUST_PROXY: "true"     # only because the ingress controller sets X-Forwarded-For
  # Code execution is disabled by default in Kubernetes: sandboxing untrusted
  # code needs a deliberate design (dedicated node pool + gVisor/Kata/Firecracker).
  # To use the remote runner daemon set GOLEARN_RUNNER=remote plus URL and token
  # (see docs/sandbox.md).
  GOLEARN_RUNNER: "disabled"
# Credentials are NOT stored here or anywhere in this directory. The API reads
# DATABASE_URL (and GOLEARN_RUNNER_TOKEN when using the remote runner) from the
# golearn-secrets Secret that you create out of band — see deploy/k8s/README.md.
